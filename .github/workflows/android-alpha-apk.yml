name: PocketHost v0.1.0 Alpha Universal Installer APK
run-name: Pocket Host Alpha universal installer APK
permissions:
  contents: read
concurrency:
  group: pockethost-alpha-apk-builder-${{ github.ref }}-${{ inputs.abi || 'all' }}
  cancel-in-progress: true
on:
  push:
    branches: [Alpha]
    paths:
      - ".github/workflows/android-alpha-apk.yml"
      - ".github/workflows/android-integration.yml"
      - "app/**"
      - "runtime-worker/**"
      - "rust-engine/**"
      - "relay-node/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "scripts/build-cloudflared-android.sh"
  workflow_dispatch:
jobs:
  build-and-verify-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Record build provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pockethost-apks"
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "version=0.1.0"
            echo "channel=Alpha"
            echo "abi_selection=universal (arm64-v8a, armeabi-v7a, x86_64)"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "signing=debug (development and owner testing only)"
          } | tee "$RUNNER_TEMP/pockethost-apks/BUILD-INFO.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build pinned Cloudflare Tunnel executable for all Android ABIs
        run: bash scripts/build-cloudflared-android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate runtime asset prerequisites
        run: ./gradlew :runtime-worker:generateDebugPythonMiscAssets
      - name: Build companion runtime-worker APK
        run: ./gradlew :runtime-worker:assembleDebug
      - name: Build one universal PocketHost installer APK
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pockethost-apks"
          echo "arm64-v8a,armeabi-v7a,x86_64" > "$out/APP-ABIS.txt"
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$out/pockethost-v0.1.0-alpha-universal-debug.apk"
      - name: Verify universal APK, embedded companion and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pockethost-apks"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          worker="$out/pockethost-runtime-worker-v0.1.0-alpha-debug.apk"
          apk="$out/pockethost-v0.1.0-alpha-universal-debug.apk"
          "$aapt" dump badging "$worker" | grep -F "package: name='com.assayflux.pockethost.worker' versionCode='1' versionName='0.1.0'"
          "$apksigner" verify --verbose --print-certs "$worker" > "$out/worker-signature.txt"
          worker_cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$out/worker-signature.txt" | head -n1)"
          test -n "$worker_cert"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.assayflux.pockethost' versionCode='1' versionName='0.1.0'"
          "$apksigner" verify --verbose --print-certs "$apk" > "$out/app-signature.txt"
          app_cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$out/app-signature.txt" | head -n1)"
          test "$app_cert" = "$worker_cert"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libpockethost.so"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libassayflux_relay_node.so"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libcloudflared.so"
          done
          unzip -Z1 "$apk" | grep -Fx "assets/pockethost-runtime-worker.apk"
          unzip -p "$apk" "assets/pockethost-runtime-worker.apk" > "$out/embedded-runtime-worker.apk"
          cmp "$worker" "$out/embedded-runtime-worker.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$out/embedded-runtime-worker.apk" | grep -Fx "lib/$abi/libnode.so"
          done
          test -d app/src/main/assets/licenses/cloudflared
          find app/src/main/assets/licenses/cloudflared -type f -print -quit | grep -q .
          sha256sum "$apk" | tee "$out/SHA256SUMS"
          echo "Universal APK, embedded runtime companion, signing certificate and native ABI payloads verified." | tee "$out/APK-VERIFICATION.txt"
          rm -f "$worker" "$out/worker-signature.txt" "$out/embedded-runtime-worker.apk"
      - name: Upload APKs and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-v0.1.0-alpha-universal-installer-apk
          path: ${{ runner.temp }}/pockethost-apks/*
          if-no-files-found: error
          retention-days: 30
