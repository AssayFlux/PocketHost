name: PocketHost v0.1.0 Alpha APK and ABI packaging
run-name: Pocket Host Alpha APK build (${{ inputs.abi || 'all' }})
permissions:
  contents: read
concurrency:
  group: pockethost-alpha-apk-builder-${{ github.ref }}-${{ inputs.abi || 'all' }}
  cancel-in-progress: false
on:
  push:
    branches: [Alpha]
    paths:
      - '.github/workflows/android-alpha-apk.yml'
  workflow_dispatch:
    inputs:
      abi:
        description: App APK ABI target
        required: true
        type: choice
        default: all
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
jobs:
  build-and-verify-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Record build provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pockethost-apks"
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "version=0.1.0"
            echo "channel=Alpha"
            echo "abi_selection=${{ inputs.abi }}"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "signing=debug (development and owner testing only)"
          } | tee "$RUNNER_TEMP/pockethost-apks/BUILD-INFO.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate runtime asset prerequisites
        run: ./gradlew :runtime-worker:generateDebugPythonMiscAssets
      - name: Build companion runtime-worker APK
        run: ./gradlew :runtime-worker:assembleDebug
      - name: Build selected app ABI APKs
        shell: bash
        env:
          ABI_SELECTION: ${{ inputs.abi || 'all' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pockethost-apks"
          if [[ "$ABI_SELECTION" == "all" ]]; then
            abis=(arm64-v8a armeabi-v7a x86_64)
          else
            abis=("$ABI_SELECTION")
          fi
          printf '%s\n' "${abis[@]}" > "$out/APP-ABIS.txt"
          for abi in "${abis[@]}"; do
            ./gradlew :app:assembleDebug -PpockethostAbi="$abi"
            cp app/build/outputs/apk/debug/app-debug.apk "$out/pockethost-v0.1.0-alpha-$abi-debug.apk"
          done
          cp runtime-worker/build/outputs/apk/debug/runtime-worker-debug.apk "$out/pockethost-runtime-worker-v0.1.0-alpha-debug.apk"
      - name: Verify APK metadata, signatures and native ABI payloads
        shell: bash
        env:
          ABI_SELECTION: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pockethost-apks"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          worker="$out/pockethost-runtime-worker-v0.1.0-alpha-debug.apk"
          "$aapt" dump badging "$worker" | grep -F "package: name='com.assayflux.pockethost.worker' versionCode='1' versionName='0.1.0'"
          "$apksigner" verify --verbose --print-certs "$worker" > "$out/worker-signature.txt"
          worker_cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$out/worker-signature.txt" | head -n1)"
          test -n "$worker_cert"
          if [[ "$ABI_SELECTION" == "all" ]]; then
            abis=(arm64-v8a armeabi-v7a x86_64)
          else
            abis=("$ABI_SELECTION")
          fi
          for abi in "${abis[@]}"; do
            apk="$out/pockethost-v0.1.0-alpha-$abi-debug.apk"
            "$aapt" dump badging "$apk" | grep -F "package: name='com.assayflux.pockethost' versionCode='1' versionName='0.1.0'"
            "$apksigner" verify --verbose --print-certs "$apk" > "$out/app-$abi-signature.txt"
            app_cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$out/app-$abi-signature.txt" | head -n1)"
            test "$app_cert" = "$worker_cert"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libpockethost.so"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libassayflux_relay_node.so"
          done
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$worker" | grep -Fx "lib/$abi/libnode.so"
          done
          sha256sum "$out"/*.apk | tee "$out/SHA256SUMS"
          echo "APK metadata, signing certificate and requested ABI payloads verified." | tee "$out/APK-VERIFICATION.txt"
      - name: Upload APKs and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-v0.1.0-alpha-apks-${{ inputs.abi || 'all' }}
          path: ${{ runner.temp }}/pockethost-apks/*
          if-no-files-found: error
          retention-days: 30
