name: PocketHost Android emulator acceptance
permissions:
  contents: read
concurrency:
  group: pockethost-emulator-acceptance-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [Alpha]
    paths:
      - ".github/workflows/android-emulator-acceptance.yml"
      - ".github/workflows/android-integration.yml"
      - "app/**"
      - "buildSrc/**"
      - "Assets/Pocket Host 7.svg"
      - "runtime-worker/**"
      - "rust-engine/**"
      - "relay-node/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "scripts/build-cloudflared-android.sh"
  workflow_dispatch:
jobs:
  emulator-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build pinned Cloudflare Tunnel executable for Android
        run: bash scripts/build-cloudflared-android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build separate PocketHost and runtime worker APKs
        run: |
          set -euo pipefail
          ./gradlew :runtime-worker:assembleDebug :app:assembleDebug -PpockethostAbi=x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted runners may lack KVM. The action then adds -accel off;
          # explicitly allow Android Emulator's TCG software CPU fallback.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -camera-front none"
          script: |
            # The emulator action may execute from its own action directory.
            # Anchor every repository path to GITHUB_WORKSPACE.
            set -eu
            cd "$GITHUB_WORKSPACE"
            app_apk="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
            worker_apk="$GITHUB_WORKSPACE/runtime-worker/build/outputs/apk/debug/runtime-worker-debug.apk"
            echo "Repository: $PWD"
            test -s "$app_apk" || { echo "Missing app APK: $app_apk"; find "$GITHUB_WORKSPACE/app/build/outputs" -maxdepth 5 -type f -name '*.apk' -print 2>/dev/null || true; exit 1; }
            test -s "$worker_apk" || { echo "Missing runtime APK: $worker_apk"; find "$GITHUB_WORKSPACE/runtime-worker/build/outputs" -maxdepth 5 -type f -name '*.apk' -print 2>/dev/null || true; exit 1; }
            adb start-server
            adb wait-for-device
            booted=""
            attempt=0
            while [ "$attempt" -lt 90 ]; do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              [ "$booted" = "1" ] && break
              attempt=$((attempt + 1))
              sleep 2
            done
            test "$booted" = "1" || { echo "Android emulator did not finish booting."; exit 1; }
            adb install -r "$worker_apk"
            adb install -r "$app_apk"
            adb shell pm path com.assayflux.pockethost.worker
            adb shell pm path com.assayflux.pockethost
            "$GITHUB_WORKSPACE/gradlew" :app:connectedDebugAndroidTest -PpockethostAbi=x86_64 --stacktrace
