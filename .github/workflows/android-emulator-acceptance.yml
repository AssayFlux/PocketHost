name: PocketHost Android emulator acceptance
permissions:
  contents: read
concurrency:
  group: pockethost-emulator-acceptance-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [Alpha]
    paths:
      - ".github/workflows/android-emulator-acceptance.yml"
      - ".github/workflows/android-integration.yml"
      - "app/**"
      - "runtime-worker/**"
      - "rust-engine/**"
      - "relay-node/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "scripts/build-cloudflared-android.sh"
  workflow_dispatch:
jobs:
  emulator-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build pinned Cloudflare Tunnel executable for Android
        run: bash scripts/build-cloudflared-android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build PocketHost APK with embedded runtime companion
        run: |
          set -euo pipefail
          ./gradlew :runtime-worker:generateDebugPythonMiscAssets :app:assembleDebug -PpockethostAbi=x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted runners may lack KVM. The action then adds -accel off;
          # explicitly allow Android Emulator's TCG software CPU fallback.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -camera-front none"
          script: |
            set -euo pipefail
            app_apk="app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$app_apk"
            unzip -p "$app_apk" "assets/pockethost-runtime-worker.apk" > "$RUNNER_TEMP/pockethost-runtime-worker.apk"
            test -s "$RUNNER_TEMP/pockethost-runtime-worker.apk"
            adb install -r "$RUNNER_TEMP/pockethost-runtime-worker.apk"
            ./gradlew :app:connectedDebugAndroidTest -PpockethostAbi=x86_64 --stacktrace
