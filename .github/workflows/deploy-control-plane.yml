name: Deploy PocketHost Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pockethost-control-plane-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment configuration
        env:
          HOST: ${{ vars.POCKETHOST_CONTROL_HOST }}
          USER: ${{ vars.POCKETHOST_CONTROL_USER }}
          PATH_ON_HOST: ${{ vars.POCKETHOST_CONTROL_PATH }}
          DOMAIN: ${{ vars.POCKETHOST_CONTROL_DOMAIN }}
          ORIGIN: ${{ vars.POCKETHOST_CONTROL_ORIGIN }}
          SSH_KEY: ${{ secrets.POCKETHOST_CONTROL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.POCKETHOST_CONTROL_KNOWN_HOSTS }}
          ADMIN_TOKEN: ${{ secrets.POCKETHOST_CONTROL_ADMIN_TOKEN }}
          DB_PASSWORD: ${{ secrets.POCKETHOST_POSTGRES_PASSWORD }}
          TUNNEL_TOKEN: ${{ secrets.POCKETHOST_CONTROL_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          for value in "$HOST" "$USER" "$PATH_ON_HOST" "$DOMAIN" "$ORIGIN" "$SSH_KEY" "$KNOWN_HOSTS" "$ADMIN_TOKEN" "$DB_PASSWORD"; do
            test -n "$value" || { echo "Missing production environment variable or secret"; exit 1; }
          done
          test "${#ADMIN_TOKEN}" -ge 64
          [[ "$ORIGIN" == https://* ]]
          [[ "$DOMAIN" != *"/"* ]]

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.POCKETHOST_CONTROL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.POCKETHOST_CONTROL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update source and deploy Compose stack
        env:
          HOST: ${{ vars.POCKETHOST_CONTROL_HOST }}
          USER: ${{ vars.POCKETHOST_CONTROL_USER }}
          PATH_ON_HOST: ${{ vars.POCKETHOST_CONTROL_PATH }}
          DOMAIN: ${{ vars.POCKETHOST_CONTROL_DOMAIN }}
          ORIGIN: ${{ vars.POCKETHOST_CONTROL_ORIGIN }}
          ADMIN_TOKEN: ${{ secrets.POCKETHOST_CONTROL_ADMIN_TOKEN }}
          DB_PASSWORD: ${{ secrets.POCKETHOST_POSTGRES_PASSWORD }}
          TUNNEL_TOKEN: ${{ secrets.POCKETHOST_CONTROL_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "mkdir -p '$PATH_ON_HOST' && if [ -d '$PATH_ON_HOST/.git' ]; then git -C '$PATH_ON_HOST' fetch origin Alpha && git -C '$PATH_ON_HOST' reset --hard origin/Alpha; else git clone --branch Alpha https://github.com/AssayFlux/PocketHost.git '$PATH_ON_HOST'; fi"
          printf 'CONTROL_PLANE_DOMAIN=%s\nPOCKETHOST_CONTROL_API_HOST=%s\nPOCKETHOST_CONTROL_ORIGIN=%s\nPOCKETHOST_CONTROL_ADMIN_TOKEN=%s\nPOSTGRES_DB=pockethost\nPOSTGRES_USER=pockethost\nPOSTGRES_PASSWORD=%s\nPOCKETHOST_CONTROL_TUNNEL_TOKEN=%s\n' "$DOMAIN" "$DOMAIN" "$ORIGIN" "$ADMIN_TOKEN" "$DB_PASSWORD" "$TUNNEL_TOKEN" |
            ssh "$USER@$HOST" "umask 077; cat > '$PATH_ON_HOST/control-plane/.env'"
          if [ -n "$TUNNEL_TOKEN" ]; then
            ssh "$USER@$HOST" "cd '$PATH_ON_HOST/control-plane' && docker compose --env-file .env --profile public stop caddy >/dev/null 2>&1 || true"
            ssh "$USER@$HOST" "cd '$PATH_ON_HOST/control-plane' && docker compose --env-file .env --profile cloudflare up -d --build"
          else
            ssh "$USER@$HOST" "cd '$PATH_ON_HOST/control-plane' && docker compose --env-file .env --profile cloudflare stop cloudflared >/dev/null 2>&1 || true"
            ssh "$USER@$HOST" "cd '$PATH_ON_HOST/control-plane' && docker compose --env-file .env --profile public up -d --build"
          fi

      - name: Verify deployed HTTPS endpoint
        env:
          DOMAIN: ${{ vars.POCKETHOST_CONTROL_DOMAIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://$DOMAIN/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Control Plane did not become healthy within three minutes" >&2
          exit 1
