name: PocketHost dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - "build.gradle.kts"
      - "app/build.gradle.kts"
      - "runtime-worker/build.gradle.kts"
      - "rust-engine/Cargo.toml"
      - ".cargo/config.toml"
      - "control-plane/Cargo.toml"
      - "web-console/package.json"
      - ".github/workflows/lock-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pockethost-dependency-locks
  cancel-in-progress: false

jobs:
  resolve-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve Cargo dependency graphs
        run: |
          cargo generate-lockfile --manifest-path rust-engine/Cargo.toml
          cargo generate-lockfile --manifest-path control-plane/Cargo.toml
      - name: Resolve TypeScript console dependency graph
        working-directory: web-console
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve Android Gradle dependency graphs without building APKs
        run: gradle --no-daemon --write-locks :app:dependencies :runtime-worker:dependencies
      - name: Commit generated dependency locks
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock resolved application dependencies"
          git push origin HEAD:main
