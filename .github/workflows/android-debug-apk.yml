name: PocketHost Android debug APK packaging (manual only)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: Explicitly confirm that APK packaging should run
        required: true
        type: boolean
        default: false

jobs:
  package-debug-apks:
    if: inputs.confirm_build == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and verify APKs
        run: |
          set -euo pipefail
          ./gradlew :runtime-worker:assembleDebug
          for abi in arm64-v8a armeabi-v7a x86_64; do
            ./gradlew clean :app:assembleDebug -PpockethostAbi="$abi"
            mkdir -p "$RUNNER_TEMP/apks"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apks/pockethost-app-$abi-debug.apk"
          done
          cp runtime-worker/build/outputs/apk/debug/runtime-worker-debug.apk "$RUNNER_TEMP/apks/pockethost-runtime-worker-debug.apk"
          sha256sum "$RUNNER_TEMP"/apks/*.apk | tee "$RUNNER_TEMP/apks/SHA256SUMS"
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pockethost-v0.1.0-alpha-debug-apks
          path: "$RUNNER_TEMP/apks/*"
          if-no-files-found: error
          retention-days: 14
