name: PocketHost Android App Quality
on:
  push:
    branches: [Alpha]
    paths: ["app/**", "buildSrc/**", "Assets/Pocket Host 7.svg", "rust-engine/**", "relay-node/**", "gradle/**", "gradlew", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/android-app-quality.yml"]
  pull_request:
    branches: [Alpha]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-app-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-android-app-quality-reports
          path: app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
