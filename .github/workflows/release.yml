name: PocketHost signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflared-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;27.2.12479018"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build pinned cloudflared for Android ABIs
        run: bash scripts/build-cloudflared-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pockethost-cloudflared-android-jni
          path: |
            app/src/main/jniLibs/*/libcloudflared.so
            app/src/main/assets/licenses/cloudflared/**
          if-no-files-found: error
          retention-days: 7

  signed-release:
    needs: cloudflared-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pockethost-cloudflared-android-jni
          path: app/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETHOST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Add POCKETHOST_KEYSTORE_BASE64 to repository Actions secrets."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pockethost-release.jks"
          test -s "$RUNNER_TEMP/pockethost-release.jks"
      - name: Build signed release APK
        env:
          POCKETHOST_KEYSTORE_FILE: ${{ runner.temp }}/pockethost-release.jks
          POCKETHOST_KEYSTORE_PASSWORD: ${{ secrets.POCKETHOST_KEYSTORE_PASSWORD }}
          POCKETHOST_KEY_ALIAS: ${{ secrets.POCKETHOST_KEY_ALIAS }}
          POCKETHOST_KEY_PASSWORD: ${{ secrets.POCKETHOST_KEY_PASSWORD }}
        run: |
          test -n "$POCKETHOST_KEYSTORE_PASSWORD"
          test -n "$POCKETHOST_KEY_ALIAS"
          test -n "$POCKETHOST_KEY_PASSWORD"
          gradle :app:assembleRelease
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pockethost-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
