name: PocketHost Android App APK
on:
  push:
    branches: [Alpha]
    paths: ["app/**", "buildSrc/**", "Assets/Pocket Host 7.svg", "rust-engine/**", "relay-node/**", "gradle/**", "gradlew", "build.gradle.kts", "settings.gradle.kts", "scripts/build-cloudflared-android.sh", ".github/workflows/android-app-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-app-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with: { go-version: "1.27.4", cache: false }
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: bash scripts/build-cloudflared-android.sh
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build PocketHost app only
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify app APK and ensure runtime worker is not bundled
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libpockethost.so"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libassayflux_relay_node.so"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libcloudflared.so"
          done
          if unzip -Z1 "$apk" | grep -Fq "assets/pockethost-runtime-worker.apk"; then
            echo "Runtime worker must be distributed as a separate APK." >&2
            exit 1
          fi
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pockethost-android-app-alpha-debug
          path: app/build/outputs/apk/debug/*
          if-no-files-found: error
          retention-days: 30
