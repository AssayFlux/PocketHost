name: Refresh PocketHost Android dependency locks

on:
  push:
    branches: [Alpha]
    paths:
      - ".github/workflows/refresh-android-dependency-locks.yml"
      - "app/build.gradle.kts"
      - "app/gradle.lockfile"
      - "runtime-worker/build.gradle.kts"
      - "runtime-worker/gradle.lockfile"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"

permissions:
  contents: write

concurrency:
  group: pockethost-android-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Alpha
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve and write the complete Android dependency lock state
        run: ./gradlew :app:dependencies :runtime-worker:dependencies --write-locks --no-daemon
      - name: Upload the generated Android dependency lock state
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-android-dependency-locks
          path: |
            app/gradle.lockfile
            runtime-worker/gradle.lockfile
          if-no-files-found: error
          retention-days: 7
      - name: Commit refreshed dependency lock with the GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const paths = ['app/gradle.lockfile', 'runtime-worker/gradle.lockfile'];
            for (const path of paths) {
              const content = fs.readFileSync(path, 'base64');
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'Alpha' });
              if (current.data.encoding === 'base64' &&
                  Buffer.from(current.data.content, 'base64').equals(Buffer.from(content, 'base64'))) {
                core.info(`${path} is already current.`);
                continue;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch: 'Alpha',
                sha: current.data.sha,
                message: 'Refresh Android dependency locks',
                content
              });
              core.info(`Committed refreshed lock state: ${path}`);
            }
