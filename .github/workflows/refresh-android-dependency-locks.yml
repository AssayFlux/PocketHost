name: Refresh PocketHost Android dependency locks

on:
  push:
    branches: [Alpha]
    paths:
      - ".github/workflows/refresh-android-dependency-locks.yml"
      - "app/build.gradle.kts"
      - "app/gradle.lockfile"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"

permissions:
  contents: read

concurrency:
  group: pockethost-android-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Alpha
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve and write the complete Android dependency lock state
        run: ./gradlew :app:dependencies --write-locks --no-daemon
      - name: Upload the generated Android dependency lock state
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-android-dependency-locks
          path: app/gradle.lockfile
          if-no-files-found: error
          retention-days: 7
