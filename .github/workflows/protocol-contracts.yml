name: Protocol contract validation

on:
  push:
    paths:
      - "protocol/**"
      - "scripts/validate-protocol.py"
      - ".github/workflows/protocol-contracts.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "scripts/validate-protocol.py"
      - ".github/workflows/protocol-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate protocol schemas and version alignment
        run: python scripts/validate-protocol.py
