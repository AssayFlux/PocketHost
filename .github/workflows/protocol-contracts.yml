name: Protocol contract validation

on:
  push:
    branches: [Alpha]
  pull_request:
    branches: [Alpha]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate protocol schemas and role policy
        run: python scripts/validate-protocol.py
      - name: Run protocol and trust-state simulations
        run: python -m unittest discover -s tests -p 'test_protocol_contracts.py' -v
