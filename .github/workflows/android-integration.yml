name: PocketHost Android native and source validation
permissions:
  contents: read

concurrency:
  group: pockethost-android-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [Alpha]
    paths:
      - ".github/workflows/android-integration.yml"
      - "app/**"
      - "runtime-worker/**"
      - "rust-engine/**"
      - "relay-node/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "scripts/build-cloudflared-android.sh"
      - "scripts/validate-android-role-policy.py"
      - "protocol/ROLE_CAPABILITY_POLICY.json"
  pull_request:
    branches: [Alpha]
    paths:
      - ".github/workflows/android-integration.yml"
      - "app/**"
      - "runtime-worker/**"
      - "rust-engine/**"
      - "relay-node/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "scripts/build-cloudflared-android.sh"
      - "scripts/validate-android-role-policy.py"
      - "protocol/ROLE_CAPABILITY_POLICY.json"
  workflow_dispatch:

jobs:
  android-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build static hosting engine for all declared Android ABIs
        working-directory: rust-engine
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o "$RUNNER_TEMP/engine-jni" build --release --locked
      - name: Build native relay for all declared Android ABIs
        working-directory: relay-node
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o "$RUNNER_TEMP/relay-jni" build --release --locked
      - name: Verify Android ELF architectures and ABI coverage
        run: |
          set -euo pipefail
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "$RUNNER_TEMP/engine-jni/$abi/libpockethost.so"
            test -s "$RUNNER_TEMP/relay-jni/$abi/libassayflux_relay_node.so"
            "$readelf" -h "$RUNNER_TEMP/engine-jni/$abi/libpockethost.so"
            "$readelf" -h "$RUNNER_TEMP/relay-jni/$abi/libassayflux_relay_node.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pockethost-native-android-libraries
          path: |
            ${{ runner.temp }}/engine-jni/**
            ${{ runner.temp }}/relay-jni/**
          if-no-files-found: error
          retention-days: 7

  android-source-compile:
    runs-on: ubuntu-24.04
    needs: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: actions/download-artifact@v4
        with:
          name: pockethost-native-android-libraries
          path: "$RUNNER_TEMP/native"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android app and instrumentation Kotlin without assembling APKs
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :runtime-worker:compileDebugKotlin :runtime-worker:externalNativeBuildDebug -PpockethostAbi=x86_64
