name: PocketHost Android integration

on:
  # Build and exercise the APK automatically when Android/native hosting code changes.
  push:
    branches: [main]
    paths:
      - "app/**"
      - "rust-engine/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-integration.yml"
  # Run device-level regression on every Android/native/runtime push and pull request.
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "rust-engine/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-integration.yml"
  # Full ABI APK build can also be requested manually.
  workflow_dispatch:
    inputs:
      run_emulators:
        description: Run API 26, 33 and 35 emulator instrumentation after APK build
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pockethost-android-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloudflared-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;27.2.12479018"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build pinned cloudflared for Android ABIs
        run: bash scripts/build-cloudflared-android.sh
      - name: Verify Android ELF architectures
        run: |
          file app/src/main/jniLibs/*/libcloudflared.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h app/src/main/jniLibs/armeabi-v7a/libcloudflared.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h app/src/main/jniLibs/x86_64/libcloudflared.so
      - uses: actions/upload-artifact@v4
        with:
          name: pockethost-cloudflared-android-jni
          path: |
            app/src/main/jniLibs/*/libcloudflared.so
            app/src/main/assets/licenses/cloudflared/**
          if-no-files-found: error
          retention-days: 7

  android-apk:
    needs: cloudflared-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pockethost-cloudflared-android-jni
          path: app/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - name: Configure NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build separate ABI debug APKs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pockethost-debug-apks"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            gradle clean :app:assembleDebug -PpockethostAbi="$abi"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pockethost-debug-apks/app-$abi-debug.apk"
          done
          mkdir -p app/build/outputs/apk/debug
          rm -f app/build/outputs/apk/debug/app-debug.apk
          cp "$RUNNER_TEMP"/pockethost-debug-apks/*.apk app/build/outputs/apk/debug/
      - name: Verify ABI-specific APK contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for apk in app/build/outputs/apk/debug/*.apk; do
            count=$((count + 1))
            case "$apk" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *) echo "Unexpected APK: $apk"; exit 1 ;;
            esac
            unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-contents.txt"
            grep -Fxq "lib/$abi/libnode.so" "$RUNNER_TEMP/apk-contents.txt"
            grep -Fxq "lib/$abi/libnodebridge.so" "$RUNNER_TEMP/apk-contents.txt"
            grep -Fxq "lib/$abi/libpockethost.so" "$RUNNER_TEMP/apk-contents.txt"
            grep -Fxq "lib/$abi/libcloudflared.so" "$RUNNER_TEMP/apk-contents.txt"
            sha256sum "$apk"
          done
          test "$count" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: pockethost-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    if: (github.event_name == 'workflow_dispatch' && inputs.run_emulators) || github.event_name == 'pull_request' || github.event_name == 'push'
    needs: cloudflared-android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Emulator instrumentation is memory-heavy; serialize the three virtual
      # devices to avoid starving the Android test process on hosted runners.
      max-parallel: 1
      matrix:
        api-level: [26, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pockethost-cloudflared-android-jni
          path: app/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 emulator ndk;27.2.12479018 system-images;android-26;default;x86_64 system-images;android-33;default;x86_64 system-images;android-35;default;x86_64"
      - name: Configure NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -memory 3072 -cores 4
          emulator-boot-timeout: 900
          script: gradle clean :app:connectedDebugAndroidTest -PpockethostAbi=x86_64
      - name: Capture rendered dashboard
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/pockethost-ui"
          adb shell monkey -p com.assayflux.pockethost 1
          sleep 5
          adb exec-out screencap -p > "$RUNNER_TEMP/pockethost-ui/dashboard-api-${{ matrix.api-level }}.png"
          file "$RUNNER_TEMP/pockethost-ui/dashboard-api-${{ matrix.api-level }}.png"
      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-android-test-results-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/pockethost-ui/**
          if-no-files-found: ignore
          retention-days: 7
