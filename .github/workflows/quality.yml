name: PocketHost quality
concurrency:
  group: pockethost-quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust-engine/Cargo.toml

  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pockethost
          POSTGRES_PASSWORD: pockethost-ci
          POSTGRES_DB: pockethost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pockethost -d pockethost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pockethost:pockethost-ci@localhost:5432/pockethost
      POCKETHOST_CONTROL_ADMIN_TOKEN: ci-only-test-admin-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test remote control-plane backend and database migrations
        run: cargo test --manifest-path control-plane/Cargo.toml
      - name: Validate public and Cloudflare Tunnel Compose profiles
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POCKETHOST_CONTROL_ADMIN_TOKEN: ci-only-test-admin-token-0123456789abcdef
          POCKETHOST_CONTROL_ORIGIN: https://console.example.test
          CONTROL_PLANE_DOMAIN: api.example.test
          POCKETHOST_CONTROL_TUNNEL_TOKEN: ci-only-cloudflare-tunnel-token
        run: |
          docker pull cloudflare/cloudflared:2026.11.0
          docker compose --profile public -f control-plane/compose.yaml config --quiet
          docker compose --profile cloudflare -f control-plane/compose.yaml config --quiet

  python-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile app/src/main/python/pockethost_runtime.py examples/python-wsgi/wsgi.py
      - name: Test WSGI lifecycle
        run: python -m unittest discover -s tests/python -v

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  node-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test Node runtime metrics preload
        run: node tests/node/metrics-smoke.cjs

  android-source-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Kotlin Android source without packaging an APK
        run: gradle :app:externalNativeBuildDebug :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
