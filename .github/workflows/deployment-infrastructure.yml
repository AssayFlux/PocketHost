name: PocketHost Deployment Infrastructure
on:
  push:
    branches: [Alpha]
    paths:
      - "control-plane/Caddyfile"
      - "control-plane/compose.yaml"
      - "control-plane/Dockerfile"
      - "control-plane/trusted-proxy.caddy"
      - "control-plane/.env.example"
      - ".dockerignore"
      - ".github/workflows/deployment-infrastructure.yml"
  pull_request:
    branches: [Alpha]
    paths:
      - "control-plane/Caddyfile"
      - "control-plane/compose.yaml"
      - "control-plane/Dockerfile"
      - "control-plane/trusted-proxy.caddy"
      - "control-plane/.env.example"
      - ".dockerignore"
      - ".github/workflows/deployment-infrastructure.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pockethost-deployment-infrastructure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployment-infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane production image
        run: docker build -f control-plane/Dockerfile -t pockethost-control-plane:ci .
      - name: Validate production Compose configuration
        run: docker compose -f control-plane/compose.yaml --env-file control-plane/.env.example --profile public config --quiet
      - name: Validate Caddy production routes and trusted proxy configuration
        run: |
          docker run --rm \
            -e CONTROL_PLANE_DOMAIN=api.example.com \
            -e POCKETHOST_CONSOLE_DOMAIN=console.example.com \
            -e POCKETHOST_CLOUDFLARED_IP=172.31.240.11 \
            -v "$PWD/control-plane/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/control-plane/trusted-proxy.caddy:/etc/caddy/trusted-proxy.caddy:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
