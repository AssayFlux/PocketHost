name: PocketHost Runtime Worker APK
on:
  push:
    branches: [Alpha]
    paths: ["runtime-worker/**", "gradle/**", "gradlew", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/runtime-worker-build.yml"]
  pull_request:
    branches: [Alpha]
    paths: ["runtime-worker/**", "gradle/**", "gradlew", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/runtime-worker-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-worker-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Configure shared AssayFlux release signing (optional)
        if: ${{ secrets.ASSAYFLUX_SHARED_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ASSAYFLUX_SHARED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ASSAYFLUX_SHARED_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASSAYFLUX_SHARED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASSAYFLUX_SHARED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/assayflux-shared.jks"
          echo "POCKETHOST_KEYSTORE_FILE=$RUNNER_TEMP/assayflux-shared.jks" >> "$GITHUB_ENV"
          echo "POCKETHOST_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "POCKETHOST_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "POCKETHOST_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build standalone Runtime Worker only
        run: |
          if [[ -n "${POCKETHOST_KEYSTORE_FILE:-}" ]]; then
            ./gradlew :runtime-worker:assembleDebug :runtime-worker:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :runtime-worker:assembleDebug --no-daemon --stacktrace
          fi
      - name: Verify worker package and native ABI payloads
        run: |
          set -euo pipefail
          for apk in runtime-worker/build/outputs/apk/debug/runtime-worker-debug.apk runtime-worker/build/outputs/apk/release/runtime-worker-release.apk; do
            [[ -f "$apk" ]] || continue
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.assayflux.pockethost.worker'"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
            for abi in arm64-v8a armeabi-v7a x86_64; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libnode.so"
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libnodebridge.so"
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libpockethost_sandbox.so"
            done
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pockethost-runtime-worker-alpha-apks
          path: runtime-worker/build/outputs/apk/
          if-no-files-found: error
          retention-days: 30
