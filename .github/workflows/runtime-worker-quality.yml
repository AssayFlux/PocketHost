name: PocketHost Runtime Worker Quality
on:
  push:
    branches: [Alpha]
    paths: ["runtime-worker/**", "gradle/**", "gradlew", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/runtime-worker-quality.yml"]
  pull_request:
    branches: [Alpha]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-worker-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: ./gradlew :runtime-worker:lintDebug :runtime-worker:testDebugUnitTest :runtime-worker:externalNativeBuildDebug --no-daemon --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pockethost-runtime-worker-quality-reports
          path: runtime-worker/build/reports/**
          if-no-files-found: warn
          retention-days: 14
