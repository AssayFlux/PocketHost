openapi: 3.1.0
info:
  title: PocketHost Device Management API
  version: 1.0.0
  description: |
    Loopback-only Android management API. Pairing requires local approval in
    the PocketHost app. Bearer sessions are held in memory, expire after 12
    hours and are individually revocable. Browser CORS is limited to localhost
    development and explicit AssayFlux console origins. This API does not
    provide backup/restore or diagnostics-file transfer; those remain native
    Android user-mediated flows.
servers:
  - url: http://127.0.0.1:17841/api/v1
security:
  - DeviceBearer: []
paths:
  /health:
    get:
      security: []
      summary: Read non-sensitive API health
      responses:
        '200':
          description: API ready
  /pair/challenge:
    post:
      security: []
      summary: Request a short-lived pairing challenge
      responses:
        '201':
          description: Challenge created; approve its six-digit code in the Android app
        '429':
          description: Pairing rate limit exceeded
  /pair/complete:
    post:
      security: []
      summary: Complete an approved pairing challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: One-time bearer token issued
        '401':
          description: Challenge not approved, invalid, expired or exhausted
  /session:
    delete:
      summary: Revoke the current browser session
      responses:
        '204':
          description: Session revoked
        '401':
          description: Unauthorized
  /auth/recover-owner:
    post:
      summary: Recover the Owner password through an on-device approved pairing session
      description: Only a short-lived session created by a pairing challenge explicitly approved in the Android app can call this route. A successful recovery revokes every Owner and pairing session and returns a new Owner bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 12, maxLength: 128, format: password }
      responses:
        '200':
          description: Owner password recovered; previous Owner and pairing sessions revoked
        '400':
          description: New password does not meet policy
        '403':
          description: Device-approved pairing session required
        '404':
          description: No Owner account exists to recover
  /auth/password:
    post:
      summary: Change the authenticated account password and rotate its sessions
      description: Requires the current account password. On success, all prior sessions for that account are revoked and one replacement bearer token is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, minLength: 12, maxLength: 128, format: password }
      responses:
        '200':
          description: Password changed; prior sessions revoked and replacement token returned
        '400':
          description: New password does not meet policy
        '401':
          description: Current password is incorrect
        '503':
          description: Device management service unavailable
  /status:
    get:
      summary: Read Android service and runtime state
      responses:
        '200':
          description: Current runtime states
  /sites:
    get:
      summary: List registered sites
      responses:
        '200':
          description: Registered site list
    post:
      summary: Create or update a hostname-to-project mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, root]
              properties:
                id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
                name: { type: string, maxLength: 80 }
                root: { type: string, description: Must be an existing directory in PocketHost private storage }
                runtime: { type: string, enum: [static, python-wsgi, node], default: static }
                hostnames:
                  type: array
                  maxItems: 100
                  items: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        '201':
          description: Site mapping saved
        '400':
          description: Invalid site configuration
  /sites/{siteId}:
    delete:
      parameters:
        - in: path
          name: siteId
          required: true
          schema: { type: string }
      summary: Remove a registered site mapping
      responses:
        '204':
          description: Site removed
        '404':
          description: Site not found
  /sites/{siteId}/actions:
    post:
      parameters:
        - in: path
          name: siteId
          required: true
          schema: { type: string }
      summary: Start or stop a registered runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop] }
      responses:
        '200':
          description: Action completed or stop accepted
        '202':
          description: Runtime start accepted; poll status
        '400':
          description: Unsupported action
        '404':
          description: Site not found
        '501':
          description: Runtime action not implemented for this runtime
  /resources:
    get:
      summary: Read per-runtime resource ceilings and device memory
      responses:
        '200':
          description: Resource configuration
    post:
      summary: Set bounded Python worker and Node V8 heap limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pythonMaxWorkers, nodeHeapMb]
              properties:
                pythonMaxWorkers: { type: integer, minimum: 2, maximum: 16 }
                nodeHeapMb: { type: integer, minimum: 96, maximum: 512 }
      responses:
        '200':
          description: Limits saved; stop and restart runtimes to apply
        '400':
          description: Limits outside supported range
        '409':
          description: Stop Python and Node before changing limits
  /telemetry:
    get:
      summary: Read the latest device telemetry and bounded sample history
      responses:
        '200':
          description: Device profile and recent samples; unavailable values are represented as null
  /capacity:
    get:
      summary: Read the current admission budget and capacity profile
      responses:
        '200':
          description: Current profile, effective concurrency limit and engine counters
    post:
      summary: Apply a capacity percentage or timed profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percent]
              properties:
                percent: { type: integer, minimum: 1, maximum: 100 }
                durationMinutes: { type: integer, minimum: 0, maximum: 1440, description: Omit or set zero for an untimed profile }
      responses:
        '200':
          description: Capacity profile saved
        '400':
          description: Invalid profile or schedule
  /capacity/benchmark:
    get:
      summary: Read the current Capacity Lab benchmark state
      responses:
        '200':
          description: Benchmark status and workload-level measurements
    post:
      summary: Start a bounded static GET benchmark (hosting must be running)
      responses:
        '202':
          description: Benchmark accepted
        '409':
          description: Hosting is stopped or benchmark cannot start
  /reports:
    get:
      summary: List retained daily aggregate operations reports
      responses:
        '200':
          description: Up to 90 local daily reports
  /metrics:
    get:
      summary: Read metrics with runtime source attribution
      responses:
        '200':
          description: Runtime metrics and device memory
  /logs:
    get:
      summary: Read recent redacted operational events
      responses:
        '200':
          description: Bounded event list
  /tunnel:
    get:
      summary: Read Cloudflare Tunnel state and token-configured flag
      responses:
        '200':
          description: Tunnel state
  /tunnel/actions:
    post:
      summary: Start or stop the configured Cloudflare Tunnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop] }
      responses:
        '200':
          description: Tunnel action returned a state
        '409':
          description: Tunnel token not configured
        '503':
          description: Tunnel could not be started
components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
