[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pockethost-node-agent"
version = "0.1.0"
description = "Pocket Host Linux node agent with protocol-bound identity and role isolation"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47"]

[project.scripts]
pockethost-agent = "pockethost_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
