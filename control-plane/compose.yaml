services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pockethost}
      POSTGRES_USER: ${POSTGRES_USER:-pockethost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pockethost-control-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pockethost} -d ${POSTGRES_DB:-pockethost}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  control-plane:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pockethost}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-pockethost}
      POCKETHOST_CONTROL_ADMIN_TOKEN: ${POCKETHOST_CONTROL_ADMIN_TOKEN:?Set a long random administrator token}
      POCKETHOST_CONTROL_API_HOST: ${POCKETHOST_CONTROL_API_HOST:?Set the dedicated control-plane hostname}
      POCKETHOST_CONTROL_ORIGIN: ${POCKETHOST_CONTROL_ORIGIN:?Set the canonical HTTPS console origin for WebAuthn}
      POCKETHOST_WEBAUTHN_RP_ID: ${POCKETHOST_WEBAUTHN_RP_ID:?Set the WebAuthn RP ID to the console domain}
      POCKETHOST_CONTROL_ORIGINS: ${POCKETHOST_CONTROL_ORIGINS:?Set comma-separated exact HTTPS console origins}
      POCKETHOST_TRUSTED_PROXY_IPS: ${POCKETHOST_TRUSTED_PROXY_IPS:-172.31.240.10,172.31.240.11}
      POCKETHOST_CONTROL_BIND: 0.0.0.0:8080
      POCKETHOST_RELAY_BIND: 0.0.0.0:8081
      RUST_LOG: info
      POCKETHOST_ARTIFACT_DIR: /var/lib/pockethost/artifacts
    volumes:
      - pockethost-artifacts:/var/lib/pockethost/artifacts
    expose: ["8080", "8081"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [private]

  web-console:
    build:
      context: ..
      dockerfile: web-console/Dockerfile
      args:
        VITE_POCKETHOST_CONTROL_API_BASE: https://${CONTROL_PLANE_DOMAIN:?Set CONTROL_PLANE_DOMAIN}
    restart: unless-stopped
    expose: ["8080"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [private]

  caddy:
    profiles: ["public"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_started
      web-console:
        condition: service_healthy
    environment:
      CONTROL_PLANE_DOMAIN: ${CONTROL_PLANE_DOMAIN:?Set CONTROL_PLANE_DOMAIN}
      POCKETHOST_CONSOLE_DOMAIN: ${POCKETHOST_CONSOLE_DOMAIN:?Set POCKETHOST_CONSOLE_DOMAIN}
      POCKETHOST_CLOUDFLARED_IP: ${POCKETHOST_CLOUDFLARED_IP:-172.31.240.11}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./trusted-proxy.caddy:/etc/caddy/trusted-proxy.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      private:
        ipv4_address: ${POCKETHOST_CADDY_IP:-172.31.240.10}

  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${POCKETHOST_CONTROL_TUNNEL_TOKEN:-}
    depends_on: [control-plane]
    networks:
      private:
        ipv4_address: ${POCKETHOST_CLOUDFLARED_IP:-172.31.240.11}

volumes:
  pockethost-control-data:
  pockethost-artifacts:
  caddy-data:
  caddy-config:

networks:
  private:
    driver: bridge
    ipam:
      config:
        - subnet: ${POCKETHOST_DOCKER_SUBNET:-172.31.240.0/24}
