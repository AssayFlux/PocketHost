openapi: 3.1.0
info:
  title: AssayFlux PocketHost Remote Control Plane
  version: 1.0.0
  description: Independent backend for device registration, desired configuration and typed remote commands. Long-lived administrator credentials exchange for 12-hour revocable sessions; Android devices use device tokens.
servers:
  - url: https://control.example.com
security:
  - AdminSession: []
paths:
  /health:
    get:
      security: []
      responses:
        "200": { description: Service healthy }
  /v1/admin/session:
    post:
      security:
        - AdminCredential: []
      summary: Exchange a bootstrap or team-user API credential for a 12-hour administrative session
      responses:
        "201": { description: Short-lived session token issued once; long-lived credential is not accepted by management endpoints }
        "401": { description: Invalid API credential }
    delete:
      summary: Revoke the current administrative session
      responses:
        "204": { description: Session revoked }
        "401": { description: Invalid or expired session }
  /v1/admin/devices:
    get:
      summary: List registered devices and latest reported state
      responses:
        "200": { description: Device inventory }
    post:
      summary: Register a device and issue its one-time bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "201": { description: Device registered; device_token is returned once }
  /v1/admin/devices/{id}:
    delete:
      summary: Revoke a device and delete its configuration and queued commands
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Device revoked }
        "404": { description: Device not found }
  /v1/admin/devices/{id}/rotate-token:
    post:
      summary: Immediately revoke the current device token and issue a replacement (shown once)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: New device token issued; previous token is invalid immediately }
        "404": { description: Device not found }
  /v1/admin/devices/{id}/config:
    get:
      summary: Read desired device configuration and version
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Versioned desired configuration }
    put:
      summary: Save a versioned config and atomically queue it for the phone
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                expected_version: { type: integer, minimum: 1 }
                config: { type: object, maxProperties: 32 }
      responses:
        "200": { description: Saved and queued }
        "409": { description: Version conflict }
  /v1/admin/devices/{id}/commands:
    post:
      summary: Queue an allowlisted command for a device
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, payload]
              properties:
                kind: { type: string, enum: [site_action, tunnel_action, restart_runtime] }
                payload: { type: object }
      responses:
        "202": { description: Command queued }
  /v1/device/commands:
    get:
      security:
        - DeviceBearer: []
      summary: Poll and lease queued commands
      responses:
        "200": { description: Up to 32 commands }
  /v1/device/heartbeat:
    post:
      security:
        - DeviceBearer: []
      summary: Report current device and runtime state
      responses:
        "200": { description: Heartbeat accepted }
  /v1/device/commands/{command}/ack:
    post:
      security:
        - DeviceBearer: []
      summary: Acknowledge command execution
      parameters:
        - in: path
          name: command
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [success, result]
              properties:
                success: { type: boolean }
                result: { type: object }
      responses:
        "200": { description: Acknowledgement recorded }

  /v1/admin/users:
    get:
      summary: List team accounts (Owner only)
      responses:
        "200": { description: Team accounts without token material }
    post:
      summary: Create a named Editor or Viewer and return a one-time token (Owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                role: { type: string, enum: [editor, viewer] }
      responses:
        "201": { description: User created; token returned once }
  /v1/admin/users/{id}/rotate-token:
    post:
      summary: Immediately revoke the current team-user token and issue a replacement (Owner only, shown once)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: New user token issued; previous token is invalid immediately }
        "403": { description: Owner role required }
        "404": { description: Active user not found }
  /v1/admin/users/{id}:
    delete:
      summary: Revoke a team user (Owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: User revoked }
  /v1/admin/devices/{id}/relay-sites:
    get:
      summary: List verified and pending Relay hostnames for a device (Owner or team session)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Relay hostname inventory }
    post:
      summary: Create a pending Relay hostname binding and issue a DNS TXT proof challenge (Owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, site_id]
              properties:
                hostname: { type: string, maxLength: 253 }
                site_id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
      responses:
        "201": { description: Pending route and one-time DNS TXT challenge }
        "409": { description: Hostname already claimed }
  /v1/admin/relay-sites/{id}/verify:
    post:
      summary: Verify the hostname DNS TXT challenge and activate Relay routing (Owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Hostname verified }
        "409": { description: DNS TXT proof not found }
  /v1/admin/relay-sites/{id}:
    delete:
      summary: Remove a Relay hostname binding (Owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Hostname removed }
  /v1/relay/tls-check:
    get:
      summary: Caddy on-demand TLS authorization for a DNS-verified Relay hostname
      parameters:
        - in: query
          name: domain
          required: true
          schema: { type: string, maxLength: 253 }
      responses:
        "200": { description: Hostname is verified and enabled; certificate issuance may proceed }
        "403": { description: Hostname is not verified or enabled }
  /v1/device/relay/stream:
    get:
      security:
        - DeviceBearer: []
      summary: Open the persistent outbound server-to-device Relay event stream (SSE)
      responses:
        "200": { description: Authenticated event stream with bounded visitor requests }
        "401": { description: Invalid or revoked device token }
  /v1/device/relay/responses/{id}:
    post:
      security:
        - DeviceBearer: []
      summary: Return a bounded local HTTP response for a pending Relay request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status, body_base64]
              properties:
                id: { type: string, format: uuid }
                status: { type: integer, minimum: 200, maximum: 599 }
                headers: { type: object, maxProperties: 64 }
                set_cookies: { type: array, maxItems: 16, items: { type: string, maxLength: 8192 } }
                body_base64: { type: string, maxLength: 12582912 }
      responses:
        "204": { description: Visitor response delivered }
        "404": { description: Request expired or belongs to another device }

  /v1/admin/audit:
    get:
      summary: Read the latest 200 administrative audit events
      responses:
        "200": { description: Audit events }
  /v1/admin/devices/{id}/artifacts:
    post:
      summary: Upload a website ZIP and queue authenticated deployment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "202": { description: Archive stored and deployment queued }
        "413": { description: Archive exceeds 50 MiB }
  /v1/device/artifacts/{artifact}:
    get:
      security:
        - DeviceBearer: []
      summary: Download an artifact belonging to the authenticated device
      parameters:
        - in: path
          name: artifact
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: ZIP artifact with no-store cache policy }
        "404": { description: Artifact not found for this device }

components:
  securitySchemes:
    AdminSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 12-hour revocable session token; required for every management operation.
    AdminCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Long-lived bootstrap or team-user API credential, accepted only by POST /v1/admin/session.
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
